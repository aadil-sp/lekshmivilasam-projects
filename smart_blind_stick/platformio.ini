[platformio]
default_envs = esp12e

[env:esp12e]
platform = espressif8266
board = nodemcuv2
framework = arduino
monitor_speed = 115200
upload_speed = 921600
upload_port = /dev/cu.wchusbserial120

build_flags =
    -D PIO_FRAMEWORK_ARDUINO_LWIP2_LOW_MEMORY

lib_deps =
    ; Uses standard ESP8266 built-in libraries (ESP8266WiFi, ESP8266WebServer, DNSServer)
