<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=480, height=320, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>RoboNav-SLAM Vision HUD</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; cursor: none !important; }
  html, body {
    width: 480px;
    height: 320px;
    background: #060911;
    color: #e2e8f0;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    overflow: hidden;
    position: relative;
    padding: 6px 8px;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
  }

  /* Top Bar */
  .top-bar {
    height: 28px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    background: rgba(15, 23, 42, 0.9);
    border: 1px solid #1e293b;
    border-radius: 6px;
    padding: 0 8px;
  }
  .brand {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 12px;
    font-weight: 800;
    color: #38bdf8;
  }
  .pulse-dot {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: #10b981;
    box-shadow: 0 0 6px #10b981;
  }
  .state-badge {
    font-size: 10px;
    font-weight: 700;
    background: #064e3b;
    color: #34d399;
    border: 1px solid #059669;
    padding: 1px 7px;
    border-radius: 4px;
  }
  .clock {
    font-family: 'SF Mono', Consolas, monospace;
    font-size: 12px;
    font-weight: 700;
    color: #94a3b8;
  }

  /* Main Grid */
  .main-grid {
    height: 242px;
    display: grid;
    grid-template-columns: 220px 1fr;
    gap: 8px;
  }

  /* Left Panel */
  .card {
    background: rgba(15, 23, 42, 0.75);
    border: 1px solid #1e293b;
    border-radius: 6px;
    padding: 6px 8px;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
  }

  .ip-box {
    background: linear-gradient(135deg, rgba(14, 165, 233, 0.15), rgba(99, 102, 241, 0.15));
    border: 1px solid #0284c7;
    border-radius: 4px;
    padding: 3px 6px;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .ip-label { font-size: 9px; font-weight: 700; color: #7dd3fc; }
  .ip-value { font-family: 'SF Mono', Consolas, monospace; font-size: 13px; font-weight: 800; color: #38bdf8; }

  .stat-row { display: flex; align-items: center; justify-content: space-between; margin-top: 2px; }
  .stat-label { font-size: 10px; color: #94a3b8; display: flex; align-items: center; gap: 4px; }
  .icon-svg { width: 11px; height: 11px; fill: #38bdf8; }
  .stat-val { font-family: 'SF Mono', Consolas, monospace; font-size: 11px; font-weight: 700; color: #f1f5f9; }
  
  .bar-bg { width: 100%; height: 4px; background: #1e293b; border-radius: 2px; overflow: hidden; margin-top: 1px; }
  .bar-fill { height: 100%; border-radius: 2px; }
  .bar-temp { background: linear-gradient(90deg, #10b981, #f59e0b, #ef4444); }
  .bar-cpu { background: #38bdf8; }
  .bar-ram { background: #818cf8; }

  /* Right Panel: Dual Camera Feeds */
  .camera-container {
    display: flex;
    flex-direction: column;
    gap: 4px;
    height: 100%;
  }
  .cam-box {
    flex: 1;
    background: #020408;
    border: 1px solid #1e293b;
    border-radius: 4px;
    overflow: hidden;
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .cam-box img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }
  .cam-tag {
    position: absolute;
    top: 2px;
    left: 2px;
    background: rgba(0, 0, 0, 0.7);
    border: 1px solid #334155;
    padding: 1px 4px;
    border-radius: 3px;
    font-size: 8px;
    font-weight: 800;
    color: #f8fafc;
    letter-spacing: 0.5px;
  }

  /* Subsystems Pill Grid */
  .subs-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 3px;
  }
  .sub-pill {
    background: #0f172a;
    border: 1px solid #1e293b;
    border-radius: 3px;
    padding: 2px 4px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    font-size: 9px;
  }
  .sub-name { color: #94a3b8; font-weight: 600; }
  .sub-state { font-weight: 700; color: #10b981; font-size: 8px; }

  /* Bottom Bar */
  .bottom-bar {
    height: 20px;
    background: rgba(15, 23, 42, 0.9);
    border: 1px solid #1e293b;
    border-radius: 4px;
    padding: 0 6px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    font-size: 9px;
    color: #64748b;
  }
  .info-tag { display: flex; align-items: center; gap: 4px; color: #94a3b8; }
  .info-tag strong { color: #38bdf8; font-family: 'SF Mono', monospace; }
</style>
</head>
<body>

  <!-- TOP STATUS HEADER -->
  <div class="top-bar">
    <div class="brand">
      <div class="pulse-dot" id="pulseDot"></div>
      <span>ROBONAV-SLAM</span>
      <span style="color:#64748b; font-size:10px;">PI 5</span>
    </div>
    <div class="state-badge" id="statBadge">SYSTEM READY</div>
    <div class="clock" id="clock">--:--:--</div>
  </div>

  <!-- MAIN TELEMETRY GRID -->
  <div class="main-grid">

    <!-- LEFT: SYSTEM VITALS -->
    <div class="card">
      <div class="ip-box">
        <div class="ip-label">IP ADDRESS</div>
        <div class="ip-value" id="ipVal">10.68.210.164</div>
      </div>

      <!-- CPU TEMP -->
      <div>
        <div class="stat-row">
          <span class="stat-label">
            <svg class="icon-svg" viewBox="0 0 24 24"><path d="M15 13V5c0-1.66-1.34-3-3-3S9 3.34 9 5v8c-1.21.91-2 2.37-2 4 0 2.76 2.24 5 5 5s5-2.24 5-5c0-1.63-.79-3.09-2-4zm-4-8c0-.55.45-1 1-1s1 .45 1 1h-2z"/></svg>
            CPU Temp
          </span>
          <span class="stat-val" id="cpuTempVal">--°C</span>
        </div>
        <div class="bar-bg"><div class="bar-fill bar-temp" id="tempBar" style="width: 40%;"></div></div>
      </div>

      <!-- CPU LOAD -->
      <div>
        <div class="stat-row">
          <span class="stat-label">
            <svg class="icon-svg" viewBox="0 0 24 24"><path d="M7 2v11h3v9l7-12h-4l4-8z"/></svg>
            CPU Load
          </span>
          <span class="stat-val" id="cpuLoadVal">--%</span>
        </div>
        <div class="bar-bg"><div class="bar-fill bar-cpu" id="cpuBar" style="width: 10%;"></div></div>
      </div>

      <!-- RAM -->
      <div>
        <div class="stat-row">
          <span class="stat-label">
            <svg class="icon-svg" viewBox="0 0 24 24"><path d="M4 6h16v12H4zm2 2v8h12V8H6zm2 2h2v4H8v-4zm4 0h2v4h-2v-4z"/></svg>
            RAM
          </span>
          <span class="stat-val" id="ramVal">-- / -- MB</span>
        </div>
        <div class="bar-bg"><div class="bar-fill bar-ram" id="ramBar" style="width: 15%;"></div></div>
      </div>

      <!-- DISK / UPTIME -->
      <div class="stat-row" style="padding-top: 2px; border-top: 1px solid #1e293b;">
        <span class="stat-label">⏱️ <strong id="uptimeVal" style="color:#cbd5e1; font-weight:normal;">--</strong></span>
        <span class="stat-label">💾 <strong id="diskVal" style="color:#cbd5e1; font-weight:normal;">--</strong></span>
      </div>

      <!-- SUBSYSTEM PILLS -->
      <div class="subs-grid">
        <div class="sub-pill">
          <span class="sub-name">LiDAR</span>
          <span class="sub-state" id="s-lidar" style="color:#f59e0b;">READY</span>
        </div>
        <div class="sub-pill">
          <span class="sub-name">Mode</span>
          <span class="sub-state" id="s-mode" style="color:#38bdf8;">MANUAL</span>
        </div>
        <div class="sub-pill">
          <span class="sub-name">Status</span>
          <span class="sub-state" id="s-stat">READY</span>
        </div>
        <div class="sub-pill">
          <span class="sub-name">Display</span>
          <span class="sub-state" style="color:#38bdf8;">3.5" SPI</span>
        </div>
      </div>
    </div>

    <!-- RIGHT: DUAL CAMERA FEEDS -->
    <div class="camera-container">
      <div class="cam-box">
        <div class="cam-tag">RGB CAMERA</div>
        <img id="rgbImg" src="/video_feed" alt="RGB Camera" />
      </div>
      <div class="cam-box">
        <div class="cam-tag">DEPTH CAMERA</div>
        <img id="depthImg" src="/depth_feed" alt="Depth Camera" />
      </div>
    </div>

  </div>

  <!-- BOTTOM BAR INFO -->
  <div class="bottom-bar">
    <div class="info-tag">
      🌐 Web: <strong>http://<span id="ipWeb">10.68.210.164</span>:5000</strong>
    </div>
    <div class="info-tag">
      💻 SSH: <strong>lekshmi@<span id="ipSsh">10.68.210.164</span></strong>
    </div>
  </div>

<script>
function updateClock() {
  const now = new Date();
  const h = String(now.getHours()).padStart(2, '0');
  const m = String(now.getMinutes()).padStart(2, '0');
  const s = String(now.getSeconds()).padStart(2, '0');
  document.getElementById('clock').innerText = `${h}:${m}:${s}`;
}
setInterval(updateClock, 1000);
updateClock();

function fetchTelemetry() {
  fetch('/api/telemetry')
    .then(r => r.json())
    .then(d => {
      if (d.ip) {
        document.getElementById('ipVal').innerText = d.ip;
        document.getElementById('ipWeb').innerText = d.ip;
        document.getElementById('ipSsh').innerText = d.ip;
      }
      
      const temp = d.cpu_temp || 42.0;
      document.getElementById('cpuTempVal').innerText = `${temp.toFixed(1)}°C`;
      const tempPct = Math.min(100, Math.max(0, ((temp - 30) / 55) * 100));
      document.getElementById('tempBar').style.width = `${tempPct}%`;

      const load = d.cpu_load || 5;
      document.getElementById('cpuLoadVal').innerText = `${load}%`;
      document.getElementById('cpuBar').style.width = `${load}%`;

      const ramUsed = d.ram_used || 240;
      const ramTotal = d.ram_total || 4039;
      const ramPct = Math.round((ramUsed / ramTotal) * 100);
      document.getElementById('ramVal').innerText = `${ramUsed}/${ramTotal}M`;
      document.getElementById('ramBar').style.width = `${ramPct}%`;

      if (d.uptime) document.getElementById('uptimeVal').innerText = d.uptime;
      if (d.disk) document.getElementById('diskVal').innerText = `${d.disk.used}/${d.disk.total}G`;
      if (d.status) document.getElementById('statBadge').innerText = d.status;
      if (d.mode) document.getElementById('s-mode').innerText = d.mode;
    });
}
fetchTelemetry();
setInterval(fetchTelemetry, 2000);
</script>
</body>
</html>
